            starting: {type: boolean}
            controlId:
              $ref: "#/components/schemas/ControlId"
    StopPendingResponse:
      allOf:
        - $ref: "#/components/schemas/StopTruth"
        - type: object
          additionalProperties: true
          required: [ok, pending, controlId]
          properties:
            ok: {const: true}
            pending: {const: true}
            controlId:
              $ref: "#/components/schemas/ControlId"
    StopConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
