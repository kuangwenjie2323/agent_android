          required: [code]
          properties:
            code:
              enum: [control_owner_changed, control_owner_terminal]
    QueueRequest:
      type: object
      additionalProperties: false
      required: [conversationId, queueId, message]
      properties:
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        queueId:
          $ref: "#/components/schemas/ControlId"
        message: {type: string, minLength: 1}
