        name: {type: string, minLength: 1, maxLength: 255}
        data_url:
          type: string
          pattern: "^data:[^;]+;base64,"
    MessageRequest:
      type: object
      additionalProperties: false
      required: [message, controlId]
      properties:
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        controlId:
          $ref: "#/components/schemas/ControlId"
        message: {type: string}
