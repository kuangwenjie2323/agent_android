          maxItems: 4
          items:
            $ref: "#/components/schemas/AttachmentInput"
        interrupt: {type: boolean}
        effort:
          $ref: "#/components/schemas/Effort"
        permMode:
          $ref: "#/components/schemas/PermissionMode"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
      x-agentweb-combined-attachment-limit: 4
      x-agentweb-decoded-bytes-per-attachment: 8388608
      x-agentweb-decoded-bytes-total: 33554432
    StopRequest:
