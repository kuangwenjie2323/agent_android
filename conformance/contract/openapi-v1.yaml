        model: {type: string, minLength: 1}
        images:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AttachmentInput"
        files:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AttachmentInput"
        effort:
          $ref: "#/components/schemas/Effort"
        permMode:
          $ref: "#/components/schemas/PermissionMode"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
      x-agentweb-combined-attachment-limit: 4
      x-agentweb-decoded-bytes-per-attachment: 8388608
      x-agentweb-decoded-bytes-total: 33554432
      x-agentweb-pending-attachment-bytes-per-conversation: 67108864
    QueueResponse:
      type: object
      additionalProperties: false
      required: [item, position, existing, pending]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        position: {type: integer, minimum: 1}
        existing: {type: boolean}
        pending: {type: boolean}
    QueueResumeRequest:
      type: object
      additionalProperties: false
      required: [conversationId, expectedHeadItemId]
      properties:
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        expectedHeadItemId:
          $ref: "#/components/schemas/ControlId"
    QueueResumeResponse:
      type: object
      additionalProperties: true
      required: [item, started, active, starting, controlId]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        started: {const: true}
        active: {type: boolean}
        starting: {type: boolean}
        controlId:
          oneOf:
            - $ref: "#/components/schemas/ControlId"
            - type: "null"
    Artifact:
      type: object
      required: [key, name, mime, size]
      properties:
        key: {type: string, minLength: 1}
        name: {type: string}
        mime: {type: string, minLength: 1}
        size: {type: integer, minimum: 0}
        generated: {type: boolean}
      additionalProperties: true
    SseEventReference:
      type: object
      description: >-
        Logical reference to conformance/contract/sse-events-v1.schema.json.
        Kept local/internal because OpenAPI contract references may not depend
        on a network URL.
      required: [type, seq]
      properties:
        type: {type: string}
        seq: {type: integer, minimum: 1}
      additionalProperties: true
